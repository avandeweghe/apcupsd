name: Build Debian package

on:
  push:
    branches: [pcnet-outlet-group]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts equivs binutils

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control

      - name: Build binary packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix=apcupsd-3.14.14/ upstream/3.14.14 | gzip -n > ../apcupsd_3.14.14.orig.tar.gz
          dpkg-buildpackage -b -us -uc
          mkdir -p out
          cp ../*.deb out/
          ls -l out

      - name: Check the patches are in the built driver
        run: |
          dpkg-deb -x out/apcupsd_*_amd64.deb /tmp/pkg
          strings /tmp/pkg/usr/sbin/apcupsd | grep -F "Management card started shutdown of outlet group"
          strings /tmp/pkg/usr/sbin/apcupsd | grep -F "OUTLSTAT : %s"
          strings /tmp/pkg/usr/sbin/apcupsd | grep -F "Killpower skipped: following outlet group"
          strings /tmp/pkg/usr/sbin/apcupsd | grep -F "+pcnetgroup3"

      - uses: actions/upload-artifact@v4
        with:
          name: apcupsd-debs
          path: out/*.deb

  publish:
    # Publish a signed APT repository to the gh-pages branch (GitHub Pages).
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    env:
      SIGNING_KEY_ID: 8F6C14E2F7D82671607EF23FE4C832745D4B6194
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends reprepro gnupg git ca-certificates

      - uses: actions/download-artifact@v4
        with:
          name: apcupsd-debs
          path: debs

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_KEY_ID" >/dev/null

      - name: Build APT repository
        run: |
          mkdir -p public/conf
          cat > public/conf/distributions <<EOF
          Origin: apcupsd-pcnet
          Label: apcupsd-pcnet
          Codename: trixie
          Architectures: amd64 all
          Components: main
          Description: apcupsd with pcnet outlet-group support (github.com/${GITHUB_REPOSITORY})
          SignWith: ${SIGNING_KEY_ID}
          EOF
          sed -i 's/^ *//' public/conf/distributions
          for d in debs/*.deb; do
            case "$d" in *-dbgsym_*) continue;; esac
            reprepro -b public includedeb trixie "$d"
          done
          reprepro -b public list trixie
          gpg --batch --armor --export "$SIGNING_KEY_ID" > public/apcupsd-pcnet.asc
          gpg --batch --export "$SIGNING_KEY_ID" > public/apcupsd-pcnet.gpg
          rm -rf public/conf public/db
          touch public/.nojekyll

      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "APT repository for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
